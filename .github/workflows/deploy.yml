name: Deploy WhatsApp Bot

# Puts a published release on the VPS: the compose file and remote-deploy.sh from the release's
# commit, the app recreated on ghcr.io/rfm-9300/whatsapp-bot:<tag>, and once /health and /ready
# answer, that release's host scripts (backups, restores, the health alert). release.yml calls it for
# every new tag. Run it by hand with an older tag to roll back. The marketing site
# (websites-thebots on the VPS) is a separate deployment and is not touched.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.4.0 (its image must already be published)
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://thebotslab.pt
    env:
      IMAGE_NAME: ghcr.io/rfm-9300/whatsapp-bot
      TAG: ${{ inputs.tag }}
    steps:
      - name: Release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag. Release tags are vMAJOR.MINOR.PATCH, e.g. v1.4.0."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release image is published
        run: |
          if ! docker manifest inspect "$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE_NAME:$TAG is not published. Pushing the tag runs the Release workflow, which builds it."
            exit 1
          fi
      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it as a GitHub Actions secret (see DEPLOYMENT_RUNBOOK.md)."
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
      - name: Sync compose file and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/whatsapp-bot"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml scripts/remote-deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:~/whatsapp-bot/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x ~/whatsapp-bot/remote-deploy.sh"
      - name: Pull and restart app
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          DEPLOY_ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN"); \
             export GHCR_USERNAME=$(printf '%q' "$GHCR_USERNAME"); \
             export TAG=$(printf '%q' "$TAG"); \
             export DEPLOY_ALERT_WEBHOOK_URL=$(printf '%q' "$DEPLOY_ALERT_WEBHOOK_URL"); \
             ~/whatsapp-bot/remote-deploy.sh"
      # Only after a healthy deploy: when health checks fail and remote-deploy.sh rolls back, the host
      # keeps the scripts that match the release still running (a backup script must know where that
      # release keeps its data).
      - name: Install host scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scripts=()
          for name in mongo-databases.sh backup-mongo.sh backup-runner.sh restore-mongo.sh restore-tenant.sh healthcheck-alert.sh; do
            if [ -f "scripts/$name" ]; then scripts+=("scripts/$name"); fi
          done
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${scripts[@]}" "$DEPLOY_USER@$DEPLOY_HOST:~/whatsapp-bot/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/whatsapp-bot && chmod +x ${scripts[*]##*/}"
