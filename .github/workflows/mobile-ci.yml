name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  # The pure-Kotlin modules (model, network, data, localization, common) have a JVM target, so
  # their tests need neither the Android SDK nor a simulator. Running them first means a broken
  # contract or a drifted string catalog fails in about a minute.
  logic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin/Native-only naming rules that the JVM and Android accept, so without this they are
      # only caught by the macOS job minutes later. Runs before the tests because it takes a second.
      - run: ./scripts/check-native-test-names.sh
      - run: ./gradlew jvmTest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Every module's unit tests, not a hand-kept list of three: a new feature module is covered
      # the moment it has a test.
      - run: ./gradlew testDebugUnitTest :androidApp:assembleDebug

  ios-framework:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64
