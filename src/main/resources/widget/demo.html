<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat widget demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 48px; background: #eef1f5; color: #1f2937; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 9px 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Website chat widget — demo</h1>
    <p>Paste a tenant's public widget key, then click <strong>Load widget</strong>. The bubble appears bottom-right.</p>
    <p>Provision a key with:<br><code>POST /api/admin/tenants/&lt;slug&gt;/channels/web</code></p>
    <label for="key">Public widget key</label>
    <input id="key" placeholder="web_xxxxxxxxxxxx" />
    <button onclick="load()">Load widget</button>
  </div>
  <script>
    function load() {
      var key = document.getElementById("key").value.trim();
      if (!key) { alert("Enter a key"); return; }
      var s = document.createElement("script");
      s.src = "/widget/widget.js";
      s.setAttribute("data-key", key);
      s.setAttribute("data-title", "Demo Assistant");
      s.setAttribute("data-welcome", "Olá! Como posso ajudar?");
      s.setAttribute("data-placeholder", "Escreva uma mensagem...");
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
