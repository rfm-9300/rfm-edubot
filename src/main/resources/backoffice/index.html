<!doctype html>
<html lang="pt-PT" data-layout="minimal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Backoffice · WhatsApp Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/style.css" />
<script src="/admin/theme.js"></script>
<script src="/admin/catalog.en.js"></script>
<script src="/admin/catalog.pt.js"></script>
<script src="/admin/catalog.es.js"></script>
<script src="/admin/i18n.js"></script>
</head>
<body>
  <aside class="sidebar" id="app-sidebar">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">BO</div>
      <div class="brand__text">
        <div class="brand__name" data-i18n="backoffice.brandName">Backoffice</div>
        <div class="brand__sub" data-i18n="backoffice.brandSub">Platform · Tenants</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav__item is-active" href="#tenants" data-view="tenants">
        <span class="nav__dot"></span>
        <span class="nav__label" data-i18n="backoffice.heroTitle">Tenants</span>
        <span class="nav__count" id="tenant-count">—</span>
      </a>
      <a class="nav__item" href="#admins" data-view="admins">
        <span class="nav__dot"></span>
        <span class="nav__label" data-i18n="backoffice.admins.nav">Admins</span>
      </a>
      <a class="nav__item" href="#backups" data-view="backups">
        <span class="nav__dot"></span>
        <span class="nav__label" data-i18n="backoffice.backups.nav">Backups</span>
      </a>
      <a class="nav__item" href="#settings" data-view="settings">
        <span class="nav__dot"></span>
        <span class="nav__label" data-i18n="backoffice.platformSettings.nav">Platform settings</span>
      </a>
    </nav>
    <div class="sidebar__foot">
      <div class="kpi"><div class="kpi__label" data-i18n="backoffice.kpiActive">Active</div><div class="kpi__value" id="kpi-active">—</div></div>
      <div class="kpi"><div class="kpi__label" data-i18n="backoffice.kpiMessages">Messages</div><div class="kpi__value" id="kpi-messages">—</div></div>
      <div class="meta"><span>v 1.0</span><span class="meta__sep">·</span><span id="meta-clock">—</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__lead">
        <button class="iconbtn iconbtn--menu" id="btn-nav" type="button" data-i18n-aria-label="common.menuOpenAria" aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false">
          <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div class="crumb"><span class="crumb__root" data-i18n="backoffice.crumbRoot">Platform</span><span class="crumb__sep">/</span><span class="crumb__leaf" data-i18n="backoffice.heroTitle">Tenants</span></div>
      </div>
      <div class="topbar__search">
        <input type="text" id="search" data-i18n-placeholder="backoffice.searchPlaceholder" data-i18n-aria-label="backoffice.searchPlaceholder" placeholder="Search tenant…" aria-label="Search tenant…" autocomplete="off" />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="topbar__actions">
        <button class="iconbtn iconbtn--theme" id="btn-theme" type="button" data-i18n-aria-label="backoffice.themeAria" aria-label="Toggle theme">🌙</button>
        <button class="btn btn--ghost" id="btn-logout" type="button" data-i18n="backoffice.logout">Log out</button>
        <button class="btn btn--primary" id="btn-new" type="button"><span class="btn__plus" aria-hidden="true">+</span><span class="btn__label" data-i18n="backoffice.newTenant">New bot/client</span></button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__head">
        <div><div class="drawer__eyebrow" id="drawer-eyebrow" data-i18n="backoffice.drawerEyebrow">Tenant</div><h2 class="drawer__title" id="drawer-title">—</h2></div>
        <button class="iconbtn" type="button" data-close data-i18n-aria-label="backoffice.closeAria" aria-label="Close">×</button>
      </header>
      <div class="drawer__body" id="drawer-body"></div>
    </aside>
  </div>

  <div class="confirm" id="confirm" hidden>
    <div class="confirm__scrim" data-confirm-cancel></div>
    <div class="confirm__panel" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 class="confirm__title" id="confirm-title" data-i18n="backoffice.confirm">Confirm</h3>
      <p class="confirm__body" id="confirm-body">—</p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" type="button" data-confirm-cancel data-i18n="backoffice.cancel">Cancel</button>
        <button class="btn btn--danger" type="button" id="confirm-ok" data-i18n="backoffice.confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/backoffice/app.js" defer></script>
</body>
</html>
