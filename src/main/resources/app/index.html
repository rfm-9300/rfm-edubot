<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tenant Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/style.css" />
<script src="/admin/theme.js"></script>
<script src="/admin/catalog.en.js"></script>
<script src="/admin/catalog.pt.js"></script>
<script src="/admin/catalog.es.js"></script>
<script src="/admin/i18n.js"></script>
</head>
<body>
  <aside class="sidebar" id="app-sidebar">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">AI</div>
      <div class="brand__text"><div class="brand__name" id="brand-name">Dashboard</div><div class="brand__sub" id="brand-sub">Chatbot · Data</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar__foot">
      <div class="kpi"><div class="kpi__label" data-i18n="app.statMessages">Messages</div><div class="kpi__value" id="kpi-messages">—</div></div>
      <div class="kpi"><div class="kpi__label" data-i18n="app.statContacts">Contacts</div><div class="kpi__value" id="kpi-users">—</div></div>
      <div class="meta"><span id="principal-type">—</span><span class="meta__sep">·</span><span id="meta-clock">—</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar__lead">
        <button class="iconbtn iconbtn--menu" id="btn-nav" type="button" data-i18n-aria-label="common.menuOpenAria" aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false">
          <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div class="crumb"><span class="crumb__root" data-i18n="app.dashboardWord">Dashboard</span><span class="crumb__sep">/</span><span class="crumb__leaf" id="crumb-leaf">Overview</span></div>
      </div>
      <div class="topbar__search"><input type="text" id="search" data-i18n-placeholder="app.searchPlaceholder" placeholder="Search…" autocomplete="off" /><kbd>/</kbd></div>
      <div class="topbar__actions"><button class="iconbtn iconbtn--theme" id="btn-theme" type="button" data-i18n-aria-label="app.themeAria" aria-label="Toggle theme">🌙</button><button class="btn btn--ghost" id="btn-logout" data-i18n="app.logout">Log out</button><button class="btn btn--primary" id="btn-new" data-i18n="app.newPrefix" hidden>New</button></div>
    </header>
    <section class="view" id="view"></section>
  </main>
  <div class="drawer" id="drawer" hidden><div class="drawer__scrim" data-close></div><aside class="drawer__panel"><header class="drawer__head"><div><div class="drawer__eyebrow" data-i18n="app.dashboardWord">Dashboard</div><h2 class="drawer__title" id="drawer-title">—</h2></div><button class="iconbtn" data-close>×</button></header><div class="drawer__body" id="drawer-body"></div></aside></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app/app.js" defer></script>
</body>
</html>
