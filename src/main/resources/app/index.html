<!doctype html>
<html lang="pt-PT" data-layout="minimal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/style.css" />
<script src="/admin/theme.js"></script>
<script src="/admin/catalog.en.js"></script>
<script src="/admin/catalog.pt.js"></script>
<script src="/admin/catalog.es.js"></script>
<script src="/admin/i18n.js"></script>
</head>
<body>
  <aside class="sidebar" id="app-sidebar">
    <button class="brand brand--switch" id="brand" type="button" aria-haspopup="dialog" disabled>
      <span class="brand__mark" aria-hidden="true">AI</span>
      <span class="brand__text"><span class="brand__name" id="brand-name">Dashboard</span><span class="brand__sub" id="brand-sub">Chatbot · Data</span></span>
      <span class="brand__chevron" aria-hidden="true"></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar__foot">
      <div class="kpi"><div class="kpi__label" id="kpi-1-label" data-i18n="app.statMessages">Messages</div><div class="kpi__value" id="kpi-messages">—</div></div>
      <div class="kpi"><div class="kpi__label" id="kpi-2-label" data-i18n="app.statContacts">Contacts</div><div class="kpi__value" id="kpi-users">—</div></div>
      <div class="meta"><span id="principal-type">—</span><span class="meta__sep">·</span><span id="meta-clock">—</span></div>
      <div class="sidebar__credit"><span data-i18n="app.poweredBy">Powered by</span> <strong>The Bots Lab</strong></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar__lead">
        <button class="iconbtn iconbtn--menu" id="btn-nav" type="button" data-i18n-aria-label="common.menuOpenAria" aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false">
          <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div class="crumb"><span class="crumb__root" data-i18n="app.dashboardWord">Dashboard</span><span class="crumb__sep">/</span><span class="crumb__leaf" id="crumb-leaf">Overview</span></div>
      </div>
      <div class="topbar__search"><input type="text" id="search" data-i18n-placeholder="app.searchPlaceholder" data-i18n-aria-label="app.searchPlaceholder" placeholder="Search…" aria-label="Search…" autocomplete="off" /><kbd aria-hidden="true">/</kbd></div>
      <div class="topbar__actions"><button class="iconbtn iconbtn--theme" id="btn-theme" type="button" data-i18n-aria-label="app.themeAria" aria-label="Toggle theme">🌙</button><button class="iconbtn iconbtn--theme iconbtn--bell" id="btn-notifications" type="button" aria-haspopup="dialog" data-i18n-aria-label="app.notifications.aria" data-i18n-title="app.notifications.aria" aria-label="Notifications" title="Notifications" hidden><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11.5V7a4 4 0 0 1 8 0v4.5l1 1H3z M8 1.6V3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 13.6a1.5 1.5 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="iconbtn__count" aria-hidden="true" hidden></span></button><button class="iconbtn iconbtn--theme iconbtn--avatar" id="btn-account" type="button" data-i18n-aria-label="app.accountAria" data-i18n-title="app.accountAria" aria-label="Your account" title="Your account" hidden></button><button class="btn btn--ghost" id="btn-logout" data-i18n="app.logout">Log out</button><button class="btn btn--primary" id="btn-new" hidden><span class="btn__plus" aria-hidden="true">+</span><span class="btn__label" data-i18n="app.newPrefix">New</span></button></div>
    </header>
    <section class="view" id="view"></section>
  </main>
  <div class="drawer" id="drawer" hidden><div class="drawer__scrim" data-close></div><aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer__head"><div><div class="drawer__eyebrow" data-i18n="app.dashboardWord">Dashboard</div><h2 class="drawer__title" id="drawer-title">—</h2></div><button class="iconbtn" data-close data-i18n-aria-label="app.closeAria" aria-label="Close">×</button></header><div class="drawer__body" id="drawer-body"></div></aside></div>
  <div class="confirm" id="confirm" hidden>
    <div class="confirm__scrim" data-confirm-cancel></div>
    <div class="confirm__panel" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 class="confirm__title" id="confirm-title" data-i18n="app.confirm">Confirm</h3>
      <p class="confirm__body" id="confirm-body">—</p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" data-confirm-cancel data-i18n="app.cancel">Cancel</button>
        <button class="btn btn--danger" id="confirm-ok" data-i18n="app.confirm">Confirm</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app/doc-template.js" defer></script>
  <script src="/app/agents.js" defer></script>
  <script src="/app/app.js" defer></script>
</body>
</html>
