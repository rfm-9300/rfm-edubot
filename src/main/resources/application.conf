ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
}

app {
    whatsapp {
        verifyToken = ${?WA_VERIFY_TOKEN}
        appSecret = ${?WA_APP_SECRET}
        phoneNumberId = ${?WA_PHONE_NUMBER_ID}
        accessToken = ${?WA_ACCESS_TOKEN}
        apiVersion = "v21.0"
    }
    openrouter {
        apiKey = ${?OPENROUTER_API_KEY}
        primaryModel = "deepseek/deepseek-v3.2-speciale"
        fallbackModel = "qwen/qwen-2.5-7b-instruct"
        maxTokens = 1024
    }
    mongo {
        uri = ${?MONGO_URI}
        database = "wabot"
    }
    ratelimit {
        perUserPerHour = 30
        perUserPerDay = 200
    }
}
