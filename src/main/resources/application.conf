ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
}

app {
    whatsapp {
        verifyToken = ${?WA_VERIFY_TOKEN}
        appSecret = ${?WA_APP_SECRET}
        phoneNumberId = ${?WA_PHONE_NUMBER_ID}
        accessToken = ${?WA_ACCESS_TOKEN}
        apiVersion = "v21.0"
        embeddedSignup {
            # Facebook app id and Embedded Signup config id are public values used by the backoffice JS SDK flow.
            appId = ${?WHATSAPP_APP_ID}
            configId = ${?WA_ES_CONFIG_ID}
        }
    }
    instagram {
        # Instagram-Login OAuth onboarding (separate Instagram app id/secret, NOT the WhatsApp app secret).
        # Leave unset to disable self-serve onboarding; manual channel binding still works.
        appId = ${?IG_APP_ID}
        appSecret = ${?IG_APP_SECRET}
        redirectUri = ${?IG_OAUTH_REDIRECT}
        graphVersion = "v25.0"
    }
    openrouter {
        apiKey = ${?OPENROUTER_API_KEY}
        primaryModel = "openai/gpt-4o-mini"
        primaryModel = ${?OPENROUTER_PRIMARY_MODEL}
        fallbackModel = "google/gemini-2.0-flash-001"
        fallbackModel = ${?OPENROUTER_FALLBACK_MODEL}
        maxTokens = 1024
    }
    mongo {
        uri = ${?MONGO_URI}
        database = "wabot"
    }
    ratelimit {
        perUserPerHour = 30
        perUserPerDay = 200
    }
    pdf {
        storagePath = "./data/pdfs"
        storagePath = ${?PDF_STORAGE_PATH}
    }
    agents {
        # How often the agents scheduler fires schedules, sweeps dates and resumes waiting runs.
        tickSeconds = 30
        tickSeconds = ${?AGENTS_TICK_SECONDS}
        # Workers for agent runs, separate from the customer chat lanes.
        lanes = 4
        lanes = ${?AGENTS_LANES}
        maxConcurrentRunsPerCompany = 2
        maxConcurrentRunsPerCompany = ${?AGENTS_MAX_CONCURRENT_RUNS_PER_COMPANY}
    }
    google {
        oauth {
            # A Google OAuth client (Web application) for connecting company Gmail accounts; separate
            # from the Firebase sign-in below. Leave unset to turn the Gmail integration off.
            clientId = ${?GOOGLE_OAUTH_CLIENT_ID}
            clientSecret = ${?GOOGLE_OAUTH_CLIENT_SECRET}
            redirectUri = ${?GOOGLE_OAUTH_REDIRECT}
        }
        gmail {
            # Reserved for Gmail push through Pub/Sub; not used yet, connected inboxes are polled.
            pubsubTopic = ${?GMAIL_PUBSUB_TOPIC}
            # "Use my inbox in automations" asks for Gmail's restricted read scopes: leave it off until
            # the OAuth client passed Google's verification and CASA assessment for them.
            inboxEnabled = ${?GMAIL_INBOX_ENABLED}
            # How often connected inboxes are checked for new mail (15-3600 seconds).
            syncSeconds = 60
            syncSeconds = ${?GMAIL_SYNC_SECONDS}
        }
    }
    integrations {
        # Base64 32-byte key encrypting integration tokens at rest (AES-256-GCM). Env-only.
        encryptionKey = ${?INTEGRATIONS_ENCRYPTION_KEY}
    }
    backups {
        # The host's backup archives (read-only) and the backup runner's control files, as mounted by
        # docker-compose.prod.yml. Unset: the backoffice's Backups page says backups aren't set up.
        archiveDir = ${?BACKUP_ARCHIVE_DIR}
        controlDir = ${?BACKUP_CONTROL_DIR}
    }
    admin {
        jwtSecret = ${?ADMIN_JWT_SECRET}
        jwtIssuer = "wabot-platform"
        jwtExpiryHours = 24
        # Leave unset to turn password login off (Google sign-in below must then be configured).
        adminPasswordHash = ${?ADMIN_PASSWORD_HASH}
        google {
            # Sign-in with Google via Firebase Auth. The web values are public. The backoffice lets in
            # only the comma-separated ADMIN_EMAILS; the tenant dashboard (/app) lets each user in with
            # the Google account linked to them (auto-linked on first sign-in by verified email).
            firebaseProjectId = ${?FIREBASE_PROJECT_ID}
            webApiKey = ${?FIREBASE_WEB_API_KEY}
            authDomain = ${?FIREBASE_AUTH_DOMAIN}
            appId = ${?FIREBASE_APP_ID}
            allowedEmails = ${?ADMIN_EMAILS}
        }
    }
}
