services:
  app:
    image: ghcr.io/rfm-9300/whatsapp-bot:${TAG:-latest}
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: "8080"
    ports: ["8080:8080"]
    restart: always
    depends_on:
      - mongo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [app]

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    command: ["--bind_ip_all"]
    restart: always

volumes:
  mongo_data:
  caddy_data:
