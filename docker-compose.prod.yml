services:
  app:
    image: ghcr.io/rfm-9300/whatsapp-bot:${TAG:-latest}
    env_file:
      - path: .env
        format: raw
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: "8080"
      PDF_STORAGE_PATH: /data/pdfs
      BACKUP_ARCHIVE_DIR: /backups
      BACKUP_CONTROL_DIR: /backup-control
    volumes:
      - pdf_data:/data/pdfs
      # backup-mongo.sh's archives, read-only, and backup-runner.sh's request/status files (Backups page).
      - ./backups:/backups:ro
      - ./backup-control:/backup-control
    restart: always
    depends_on:
      - mongo
    networks:
      - default
      - web_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    command: ["--bind_ip_all"]
    restart: always

volumes:
  mongo_data:
  pdf_data:

networks:
  web_proxy:
    external: true
