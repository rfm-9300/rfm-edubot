services:
  app:
    image: ghcr.io/rfm-9300/whatsapp-bot:${TAG:-latest}
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: "8080"
    restart: always
    depends_on:
      - mongo
    networks:
      - default
      - web_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    command: ["--bind_ip_all"]
    restart: always

volumes:
  mongo_data:

networks:
  web_proxy:
    external: true
