services:
  app:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
    command: ["--bind_ip_all"]

  mongo-express:
    image: mongo-express:latest
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on: [mongo]

volumes:
  mongo_data:
